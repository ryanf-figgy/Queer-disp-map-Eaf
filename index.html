  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r); }\n.ngo-select .clear { display: block; margin-top: 6px; font-size: 10px; color: var(--muted); cursor: pointer; font-family: \"JetBrains Mono\"; }\n\n/* ---------- main scrollytelling ---------- */\n.spine {\n  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);\n  gap: 0;\n  border-bottom: 3px solid var(--ink);\n}\n.spine .col-text {\n  border-right: 1px solid var(--ink);\n  padding: 0;\n  background: var(--paper);\n}\n.spine .col-map {\n  position: sticky; top: 64px; align-self: start;\n  height: calc(100vh - 64px); min-height: 600px; max-height: 900px;\n  display: flex; flex-direction: column;\n  background: var(--paper);\n}\n.map-frame {\n  flex: 1; position: relative; overflow: hidden;\n  border-bottom: 1px solid var(--ink);\n  background: var(--paper-2);\n}\n.map-frame::before, .map-frame::after {\n  content: \"\"; position: absolute; left: 0; right: 0; height: 16px; pointer-events: none; z-index: 2;\n}\n.map-frame::before { top: 0; background: linear-gradient(to bottom, var(--paper-2), transparent); }\n.map-frame::after { bottom: 0; background: linear-gradient(to top, var(--paper-2), transparent); }\n.map-svg { width: 100%; height: 100%; display: block; }\n.map-toolbar {\n  position: absolute; left: 10px; top: 10px; z-index: 5;\n  display: flex; gap: 6px; flex-wrap: wrap; max-width: 70%;\n}\n.map-toolbar .pill {\n  background: var(--paper); border: 1.5px solid var(--ink); padding: 3px 8px;\n  font-family: \"Space Grotesk\"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px;\n  display: inline-flex; align-items: center; gap: 5px;\n}\n.map-toolbar .pill .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }\n.map-legend {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;\n  background: var(--paper);\n}\n.map-legend .lg {\n  padding: 8px 10px; border-right: 1px solid var(--ink);\n  display: flex; align-items: center; gap: 8px;\n  font-family: \"Space Grotesk\"; font-we ar(--ink); }\n.dg-table { width: 100%; border-collapse: collapse; margin: 16px 0 10px; border: 2px solid var(--ink); box-shadow: 4px 4px 0 0 var(--ink); background: var(--paper); }\n.dg-table th, .dg-table td { border: 1px solid var(--ink); }\n.dg-corner { background: var(--ink); color: var(--paper); font-family: \"Space Grotesk\"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 9px; text-align: left; padding: 6px 8px; }\n.dg-col { background: var(--paper-2); cursor: pointer; padding: 6px 4px; vertical-align: bottom; transition: background 0.12s; }\n.dg-col:hover { background: var(--highlight); }\n.dg-col.on { background: var(--ink); }\n.dg-col-key { display: block; font-family: \"Big Shoulders Display\"; font-weight: 900; font-size: 22px; line-height: 1; }\n.dg-col.on .dg-col-key, .dg-col.on .dg-col-lbl { color: var(--paper); }\n.dg-col-lbl { display: block; font-family: \"Space Grotesk\"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 7.5px; margin-top: 2px; color: var(--ink-2); max-width: 64px; margin-inline: auto; }\n.dg-rowh { text-align: left; padding: 5px 8px; font-family: \"Space Grotesk\"; font-weight: 500; font-size: 10.5px; line-height: 1.15; background: var(--paper); max-width: 190px; }\n.dg-rn { display: inline-block; font-family: \"JetBrains Mono\"; font-weight: 500; font-size: 9px; background: var(--ink); color: var(--paper); padding: 0 4px; margin-right: 5px; vertical-align: middle; }\n.dg-cell { text-align: center; font-family: \"Big Shoulders Display\"; font-weight: 800; font-size: 15px; padding: 5px 0; color: var(--muted); width: 13%; }\n.dg-cell.documented { background: var(--ink); color: var(--paper); }\n.dg-cell.partial { color: var(--ink); position: relative; background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(20,17,13,0.12) 3px 6px); }\n.dg-cell.none { color: var(--muted); font-family: \"JetBrains Mono\"; font-weight: 400; font-size: 13px; }\n.dg-cell.col-on { outline: 2px solid var(--highlight); outline-offset: -2px; }\n.dg-key { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 4px; }\n.dg-lg { display: inline-flex; align-items: center; gap: 7px; font-family: \"Space Grotesk\"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }\n.dg-sw { width: 16px; height: 16px; border: 1px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-family: \"JetBrains Mono\"; font-size: 11px; }\n.dg-sw.documented { background: var(--ink); }\n.dg-sw.partial { background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(20,17,13,0.12) 3px 6px); }\n.dg-sw.none { color: var(--muted); }\n.dg-takeaways li::before { content: \"→\"; }\n\n/* hidden step (filtered out) */\n.step.hidden-step {\n  opacity: 0.16; filter: grayscale(1);\n  pointer-events: none;\n}\n.step.hidden-step .num.hot { color: var(--ink-2); }\n\n/* compare drawer */\n.compare-strip {\n  position: sticky; bottom: 0; z-index: 25;\n  border-top: 3px solid var(--ink); background: var(--ink); color: var(--paper);\n}\n.compare-strip .bar { display: flex; align-items: center; gap: 14px; padding: 10px 28px; }\n.compare-strip .bar .ttl {\n  font-family: \"Big Shoulders Display\"; font-weight: 900; text-transform: uppercase; font-size: 22px; letter-spacing: 0.02em;\n}\n.compare-strip select {\n  background: transparent; color: var(--paper); border: 1.5px solid var(--paper); padding: 5px 8px;\n  font-family: \"Space Grotesk\"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;\n  appearance: none; cursor: pointer;\n}\n.compare-strip select option { background: var(--ink); color: var(--paper); }\n.compare-strip .toggle {\n  margin-left: auto; background: var(--hot); color: var(--paper); border: 1.5px solid var(--paper);\n  padding: 5px 10px; font-family: \"Space Grotesk\"; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; cursor: pointer;\n}\n.compare-panels {\n  display: none;\n  grid-template-columns: 1fr 1fr;\n  border-top: 1px solid var(--paper);\n}\n.compare-panels.open { display: grid; }\n.compare-panels .cp {\n  padding: 18px 28px; border-right: 1px solid var(--paper);\n  max-height: 50vh; overflow: auto;\n}\n.compare-panels .cp:last-child { border-right: 0; }\n.compare-panels .cp .lab { font-family: \"JetBrains Mono\"; font-size: 11px; opacity: 0.8; }\n.compare-panels .cp h4 { font-family: \"Big Shoulders Display\"; font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 4px 0 6px; }\n.compare-panels .cp .driver { font-family: \"Space Grotesk\"; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; color: var(--highlight); margin-bottom: 10px; }\n.compare-panels .cp p { font-size: 13px; line-height: 1.6; margin: 0 0 10px; }\n.compare-panels .cp .meta { font-family: \"JetBrains Mono\"; font-size: 11px; opacity: 0.85; }\n\n/* endnotes */\n.endnotes { padding: 40px 0 80px; border-top: 3px solid var(--ink); }\n.endnotes h3 { font-family: \"Big Shoulders Display\"; font-weight: 800; font-size: 36px; text-transform: uppercase; margin: 0 0 12px; }\n.endnotes .gap-note {\n  background: var(--ink); color: var(--paper); padding: 18px 22px;\n  border: 3px solid var(--ink); box-shadow: var(--shadow);\n  font-size: 14px; line-height: 1.55; max-width: 90ch;\n}\n.endnotes .gap-note b { background: var(--highlight); color: var(--ink); padding: 1px 5px; font-weight: 600; }\n.endnotes .colophon { margin-top: 32px; font-family: \"JetBrains Mono\"; font-size: 11px; color: var(--ink-2); line-height: 1.7; max-width: 90ch; }\n\n/* SVG map styling */\n.country { fill: var(--paper-2); stroke: var(--ink); stroke-width: 0.4; }\n.country.dimmed { fill: var(--paper-2); }\n.country-label { font-family: \"Space Grotesk\"; font-size: 8.5px; font-weight: 500; fill: var(--ink-2); pointer-events: none; text-transform: uppercase; letter-spacing: 0.08em; }\n.point-label { font-family: \"Space Grotesk\"; font-size: 9.5px; font-weight: 600; fill: var(--ink); pointer-events: none; }\n.point-label.bg { stroke: var(--paper-2); stroke-width: 3px; fill: var(--paper); paint-order: stroke; }\n\n.qd-route { fill: none; pointer-events: none; transition: opacity 0.2s, stroke-width 0.2s; }\n.qd-route.dim { opacity: 0.18; }\n.qd-route.active { stroke-width: 2.4; opacity: 1; }\n.qd-route.hidden { opacity: 0; }\n.qd-unhcr { fill: none; pointer-events: none; }\n.qd-unhcr.hidden { opacity: 0; }\n.qd-idp { fill: none; pointer-events: none; }\n.qd-idp.hidden { opacity: 0; }\n.qd-marker { cursor: pointer; transition: r 0.12s; }\n.qd-marker.active { stroke: var(--highlight); stroke-width: 3; }\n\n/* responsive */\n@media (max-width: 980px) {\n  .spine { grid-template-columns: 1fr; }\n  .spine .col-text { border-right: 0; }\n  .spine .col-map { position: sticky; top: 56px; height: 56vh; min-height: 380px; border-bottom: 3px solid var(--ink); order: 1; }\n  .spine .col-text { order: 2; }\n  .title-row { grid-template-columns: 1fr; }\n  .title-row h1 { font-size: clamp(48px, 12vw, 88px); }\n  .stats { grid-template-columns: repeat(2, 1fr); }\n  .stats .cell:nth-child(2n) { border-right: 0; }\n  .stats .cell { border-bottom: 1px solid var(--ink); }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"masthead\">\n  <div class=\"shell\">\n    <div class=\"masthead-top\">\n      <div class=\"left\">\n        <span class=\"pill\">Vol. 01 / No. 11<\u002Fspan>\n        <span class=\"meta\">SOURCE-CITED · NGO CASEWORK + UN PRIMARY DOCS<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <span class=\"meta\">DRAFT 2026·02 · <b>NOT FOR REDISTRIBUTION<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"title-row\">\n      <h1>\n        Routes of <span class=\"accent\">Queer<\u002Fspan> <span class=\"stroke\">Flight<\u002Fspan>\n      <\u002Fh1>\n      <div class=\"standfirst\">\n        Eleven documented corridors mapped against UNHCR's recognised routes. Every pop-up cites a source. <b>UNHCR does not disaggregate route-level flows by SOGIESC<\u002Fb>; the queer geography is reconstructed from NGO casework — Rainbow Railroad, ORAM, HIAS, Iraqueer, Helem and their peers — and from country-level legal documents.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"deck\">\n      <p>\n        Where queer people are forced to leave, the path they take to a country that will register them, and the much smaller list of countries that will let them stay — read as one continuous map, with the gap between what UN agencies count and what civil society documents made visible. The corridors below carry forced migration that is real, sustained, and largely <em>off the published spreadsheet<\u002Fem>.\n      <\u002Fp>\n      <div class=\"yr\">2014<small>→ 2026<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stats\">\n    <div class=\"cell hot\"><div class=\"n\" id=\"stat-corridors\">11<\u002Fdiv><div class=\"lbl\">Documented corridors<\u002Fdiv><\u002Fdiv>\n    <div class=\"cell\"><div class=\"n\" id=\"stat-countries\">23<\u002Fdiv><div class=\"lbl\">Origin / transit states<\u002Fdiv><\u002Fdiv>\n    <div class=\"cell cool\"><div class=\"n\" id=\"stat-dests\">9<\u002Fdiv><div class=\"lbl\">Destination states<\u002Fdiv><\u002Fdiv>\n    <div class=\"cell\"><div class=\"n\" id=\"stat-ngos\">28<\u002Fdiv><div class=\"lbl\">Civil-society orgs cited<\u002Fdiv><\u002Fdiv>\n    <div class=\"cell\"><div class=\"n\" id=\"stat-since\"><span id=\"stat-since-yr\">2014<\u002Fspan><span style=\"font-size:0.55em;color:var(--muted);\">→26<\u002Fspan><\u002Fdiv><div class=\"lbl\">Time window<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ---------- Filter rail ---------- -->\n<nav class=\"filter-rail\" id=\"filter-rail\">\n  <div class=\"shell\">\n    <div class=\"row\">\n      <div class=\"grp\">\n        <span class=\"ttl\">Layers<\u002Fspan>\n        <button class=\"chip on hot\" data-layer=\"queer\"><span class=\"sw\" style=\"background:var(--paper);border-color:var(--paper)\"><\u002Fspan>Queer routes<\u002Fbutton>\n        <button class=\"chip on cool\" data-layer=\"unhcr\"><span class=\"sw\" style=\"background:var(--paper);border-color:var(--paper)\"><\u002Fspan>UNHCR<\u002Fbutton>\n        <button class=\"chip on\" data-layer=\"idp\"><span class=\"sw\" style=\"background:var(--idp);border-color:var(--idp)\"><\u002Fspan>Internal<\u002Fbutton>\n        <button class=\"chip\" data-lens=\"1\"><span class=\"sw\" style=\"background:var(--cool);border-color:var(--cool)\"><\u002Fspan>Intersex lens<\u002Fbutton>\n        <button class=\"chip\" data-mode-chip=\"trans\"><span class=\"sw\" style=\"background:var(--trans);border-color:var(--trans)\"><\u002Fspan>Trans lens<\u002Fbutton>\n        <button class=\"chip\" data-mode-chip=\"disagg\"><span class=\"sw\" style=\"background:var(--ink);border-color:var(--ink)\"><\u002Fspan>Disaggregation<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"grp\">\n        <span class=\"ttl\">Stops<\u002Fspan>\n        <button class=\"chip on\" data-kind=\"origin\"><span class=\"sw\" style=\"background:var(--hot);border-color:var(--hot)\"><\u002Fspan>Origin<\u002Fbutton>\n        <button class=\"chip on\" data-kind=\"transit\"><span class=\"sw\" style=\"background:var(--ink);border-color:var(--ink)\"><\u002Fspan>Transit<\u002Fbutton>\n        <button class=\"chip on\" data-kind=\"dest\"><span class=\"sw\" style=\"background:var(--cool);border-color:var(--cool)\"><\u002Fspan>Destination<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"grp time-slider\">\n        <span class=\"ttl\">Year<\u002Fspan>\n        <input type=\"range\" id=\"year\" min=\"2014\" max=\"2026\" step=\"1\" value=\"2026\">\n        <span class=\"yrlbl\" id=\"yr-label\">2026<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"grp ngo-select\" id=\"ngo-select\">\n        <span class=\"ttl\">NGO / Source<\u002Fspan>\n        <button class=\"btn\" id=\"ngo-btn\">FILTER ▼ <span id=\"ngo-count\" style=\"background:var(--ink);color:var(--paper);padding:0 5px;margin-left:4px;display:none;\">0<\u002Fspan><\u002Fbutton>\n        <div class=\"menu\" id=\"ngo-menu\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ---------- Scrollytelling spine ---------- -->\n<main class=\"spine\">\n  <section class=\"col-text\" id=\"steps\">\n    <article class=\"step intro\" data-step=\"intro\">\n      <div class=\"meta\">A · INTRO<\u002Fdiv>\n      <h2>All eleven corridors, at once.<\u002Fh2>\n      <div class=\"summary\">\n        <p>The map to the right shows every documented queer displacement corridor in this dataset — eleven of them — alongside seven UNHCR-recognised routes that share geography but not the same population. Where the two overlap, the SOGIESC share is <em>not<\u002Fem> publicly disaggregated. Scroll to walk through them, one at a time.<\u002Fp>\n        <p>Each corridor is anchored by a legal driver (the statute, the ruling, the killing) and the civil-society organisations doing the casework. The pop-ups under each stop carry the citations. <strong style=\"background:var(--cool);color:var(--paper);padding:1px 5px;\">Section B<\u002Fstrong> then turns to the axes this map first missed — intersex people, sex characteristics, and the humanitarian-data gap.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <!-- route steps injected here -->\n    <article class=\"step\" data-step=\"outro\" id=\"step-outro\">\n      <div class=\"meta\">Z · COVERAGE GAP<\u002Fdiv>\n      <h2>Where the data goes silent.<\u002Fh2>\n      <div class=\"summary\">\n        <p>UNHCR's Routes Monitor (February 2026) does not disaggregate any route-level flow by SOGIESC. Where a per-cent figure appears in this map's pop-ups, it is from NGO casework — otherwise we flag it. The Philippines is intentionally absent: same-sex relations are not criminalised, and queer-specific transit through Manila is not documented in the way it is for the corridors shown.<\u002Fp>\n        <p>What you have just scrolled through is the public record. The unrecorded share is, by definition, larger.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fsection>\n\n  <aside class=\"col-map\" id=\"col-map\">\n    <div class=\"map-frame\">\n      <div class=\"map-toolbar\">\n        <span class=\"pill\"><span class=\"dot\" style=\"background:var(--hot)\"><\u002Fspan>Active corridor<\u002Fspan>\n        <span class=\"pill\" id=\"active-label\" style=\"display:none;\"><\u002Fspan>\n      <\u002Fdiv>\n      <svg id=\"qd-map\" class=\"map-svg\" viewBox=\"0 0 900 470\" role=\"img\" aria-label=\"World map of queer displacement routes\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"map-legend\">\n      <div class=\"lg\"><span class=\"sw\" style=\"background:var(--hot)\"><\u002Fspan>Queer route<\u002Fdiv>\n      <div class=\"lg\"><span class=\"sw\" style=\"background:var(--cool);opacity:0.55\"><\u002Fspan>UNHCR recognised<\u002Fdiv>\n      <div class=\"lg\"><span class=\"sw\" style=\"background:repeating-linear-gradient(90deg,var(--idp) 0 3px,transparent 3px 6px)\"><\u002Fspan>Internal<\u002Fdiv>\n      <div class=\"lg\"><span class=\"dot\" style=\"background:var(--hot)\"><\u002Fspan>Origin · transit · dest.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fmain>\n\n<!-- ---------- Compare drawer ---------- -->\n<div class=\"compare-strip\" id=\"compare-strip\">\n  <div class=\"bar\">\n    <span class=\"ttl\">Compare two corridors<\u002Fspan>\n    <select id=\"cmp-a\"><\u002Fselect>\n    <span class=\"mono\" style=\"color:var(--paper);\">vs.<\u002Fspan>\n    <select id=\"cmp-b\"><\u002Fselect>\n    <button class=\"toggle\" id=\"cmp-toggle\">Open panels ▾<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"compare-panels\" id=\"cmp-panels\">\n    <div class=\"cp\" id=\"cmp-pa\"><\u002Fdiv>\n    <div class=\"cp\" id=\"cmp-pb\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ---------- Endnotes ---------- -->\n<section class=\"endnotes\">\n  <div class=\"shell\">\n    <h3>Methodology &amp; coverage gap<\u002Fh3>\n    <div class=\"gap-note\">\n      Sources listed under each stop are starting points — <b>verify the most recent version before citing<\u002Fb>. NGO casework numbers (Rainbow Railroad, ORAM, HIAS, Iraqueer, Helem, Casa Frida, Roshaniya, Equal Asia Foundation, Russian LGBT Network, Blue Diamond Society) are programmatic outputs, not statistical samples. Country statutes are cited by article number where possible and cross-checked against the 76 Crimes criminalisation tracker (76crimes.com). Country-of-origin information draws on the SOGICA / Asylum Research Centre / Rainbow Migration joint SOGI country list (refugeelegalaidinformation.org). UN documents are cited by symbol — the current primary SOGI-displacement reference is A/HRC/59/43 (OHCHR Independent Expert on SOGI, April 2025), alongside the earlier A/HRC/56/CRP.8.\n    <\u002Fdiv>\n    <div class=\"gap-note\" style=\"margin-top:14px;background:var(--cool);\">\n      <b style=\"background:var(--highlight);color:var(--ink);\">Intersex / sex-characteristics layer (Section B)<\u002Fb> drawn from OII Europe's Intersex Refugees &amp; Asylum Seekers programme: Toolkit (Luan Pertl &amp; Jana Hugo, 2024); live programme page (updated 25.11.2025); Petra Sussner (2020), <em>Flucht – Geschlecht – Sexualität<\u002Fem>; EUAA Asylum Report 2024 (diverse SOGIESC); UNHCR, <em>Working with LGBTI Persons in Forced Displacement<\u002Fem>; Council of Europe Recommendation CM/Rec(2025)7 on Equal Rights for Intersex Persons (adopted 7 Oct 2025). Destination IGM-ban tiers follow OII Europe's IGM Ban Indicators / Good Practice Map and are <b style=\"background:var(--highlight);color:var(--ink);\">partial, evolving and must be re-verified<\u002Fb> before citing.\n    <\u002Fdiv>\n    <div class=\"gap-note\" style=\"margin-top:14px;background:var(--hot-deep);\">\n      <b style=\"background:var(--highlight);color:var(--ink);\">Humanitarian-action layer (Section B)<\u002Fb> drawn from Outright International &amp; Edge Effect, <em>\"They Know What We Don't: Meaningful Inclusion of LGBTIQ People in Humanitarian Action\"<\u002Fem> (July 2024) — a literature review plus interviews with staff from 12 international humanitarian organisations and case studies in Colombia, Lebanon, Myanmar, Nepal and Ukraine. This layer reframes displacement as an <b style=\"background:var(--highlight);color:var(--ink);\">in-crisis aid-access problem<\u002Fb>, distinct from the asylum/resettlement corridors. Colombia and Ukraine appear only in this layer; they are not among the eleven documented corridors.\n    <\u002Fdiv>\n    <div class=\"gap-note\" style=\"margin-top:14px;\">\n      <b style=\"background:var(--highlight);color:var(--ink);\">The disaggregation matrix (Section B)<\u002Fb> records whether each sub-population — gay men, lesbian/queer women, bisexual, trans, intersex — is <em>named in the cited sources<\u002Fem> for a corridor. It is documentation, <b style=\"background:var(--highlight);color:var(--ink);\">not demography<\u002Fb>: a filled cell does not mean \"more of this group travel here,\" only that the record sees them. The empty bisexual and intersex columns reflect a gap in documentation, not an absence of people. No quantitative SOGIESC split of these flows exists.\n    <\u002Fdiv>\n    <div class=\"gap-note\" style=\"margin-top:14px;background:var(--cool);\">\n      <b style=\"background:var(--highlight);color:var(--ink);\">The compressed destination geography.<\u002Fb> The map shows nine destination states because the world offers few. UN Women (2024) counts only <b style=\"background:var(--highlight);color:var(--ink);\">37 countries worldwide<\u002Fb> that formally grant asylum on SOGIESC grounds. ILGA-Europe’s Rainbow Map Asylum 2025 finds only <b style=\"background:var(--highlight);color:var(--ink);\">33 of 49<\u002Fb> European states include SOGIESC explicitly in asylum-qualification criteria — and sex characteristics are frequently excluded. EUAA factsheet EUAA/IAS/2025/38 (September 2025) records SOGIESC claims at <b style=\"background:var(--highlight);color:var(--ink);\">11% of all refugee grants in Spain<\u002Fb>. Destination pop-ups now carry a jurisprudence / case-law layer (EUAA SOGI case-law database; CJEU X, Y and Z; HJ (Iran) and HT (Cameroon) v SSHD).\n      <span style=\"display:block;font-family:'JetBrains Mono';font-size:11px;margin-top:8px;opacity:0.85;\">Sources: UN Women (2024); ILGA-Europe Rainbow Map Asylum 2025; EUAA factsheet EUAA/IAS/2025/38 (Sept 2025); EUAA SOGI case-law database, caselaw.euaa.europa.eu.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"colophon\">\n      Cartography: Natural Earth projection · world-atlas 110m countries (TopoJSON) · D3 v7.<br>\n      Type: Big Shoulders Display, Space Grotesk, JetBrains Mono (Google Fonts).<br>\n      Layers can be toggled in the filter rail; year slider hides corridors whose primary documented driver post-dates the selected year. Markers and routes are coloured by stop kind, not by route identity, so a country that is both transit (for one corridor) and destination (for another) carries the colour of its higher-tier role on this view.<br>\n      Last data refresh: 2026·02 against UNHCR Routes Monitor, OHCHR thematic reports, HRW country desks, and partner NGO public reports.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ---------- Scripts ---------- -->\n\n<script src=\"3686c249-d372-4fd7-bb3c-d2efec3aa16f\"><\u002Fscript>\n<script src=\"40cfb9de-31c3-4fdd-b005-0d7caeeca553\"><\u002Fscript>\n<script src=\"f504c8d5-eb88-4102-a3bd-a2234e849fac\"><\u002Fscript>\n<script src=\"f19f439a-1b01-426a-a731-4f89a74f3814\"><\u002Fscript>\n<script src=\"cf3cb8c2-9018-407f-a1fc-6a1ffb2ed696\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
